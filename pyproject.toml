[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-pruning"
version = "0.1.0"
description = "Structured channel/FFN/attention-head pruning: Max-k and CSD saliency, structural surgery, calibration-aware selection, and redundancy scanning for CNNs and Transformers"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pragnesh Thaker" }]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
transformer-experiments = ["transformers>=4.30"]
vision-experiments = ["torchvision>=0.15"]
# Only `prunelib.transformer.NetworkSaliencyScanner.scan()` (a DataFrame report) needs this.
analysis = ["pandas>=1.5"]
dev = ["pytest>=7.0", "pandas>=1.5"]

[project.urls]
Homepage = "https://github.com/thakerpragnesh/structured-pruning"

[tool.setuptools.packages.find]
# legacy_pipeline now lives under archive/ (see README.md's "What's now
# redundant") -- "archive*" picks up the archive.legacy_pipeline subpackage
# the same way "legacy_pipeline*" used to pick up the top-level one.
include = ["prunelib*", "archive*"]
